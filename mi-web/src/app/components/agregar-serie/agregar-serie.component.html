<div class="container">
  <div class="row p-5">
    <div class="col col-sm-12 col-md-6 col-lg-5 col-xl-5">
      <div class="card">
        <div class="card-body px-5 ">
          <form #serieForm="ngForm" (ngSubmit)="createSerie(serieService.elegirSerie,serieForm)">
            <input type="hidden" name="_id" [(ngModel)]="serieService.elegirSerie._id">
            <div class="form-group">
              <input type="text" class="form-control" placeholder="Titulo serie"
                     name="titulo" [(ngModel)]="serieService.elegirSerie.titulo"  required>
            </div>
            <div class="form-group">
              <input type="text" class="form-control" placeholder="Capitulos Serie"
                     name="capitulos" [(ngModel)]="serieService.elegirSerie.capitulos"  required>
            </div>
            <div class="form-group">
              <input type="text" class="form-control" placeholder="categoria"
                     name="categorias" [(ngModel)]="serieService.elegirSerie.categorias"  required>
            </div>
            <div class="form-group">
              <input type="text" class="form-control" placeholder="Emisión"
                     name="emision" [(ngModel)]="serieService.elegirSerie.emision"  required>
            </div>
            <div class="form-group">
              <textarea type="text" class="form-control" placeholder="Sinopsis"
                        name="sinopsis" [(ngModel)]="serieService.elegirSerie.sinopsis"   required></textarea>
            </div>
            <div class="form-group">
              <textarea type="text" class="form-control" placeholder="URL foto"
                        name="imagen" [(ngModel)]="serieService.elegirSerie.imagen " required></textarea>
            </div>
            <button type="submit" class="btn btn-primary btn-inline " >GUARDAR</button>
            <button type="reset" class="btn btn-danger btn-inline">LIMPIAR</button>
          </form>
        </div>
      </div>
      </div>

    <div class="col col-sm-12 col-md-6 col-lg-6 col-xl-6" >
      <div class="card px-5">
        <img src="{{serieService.elegirSerie.imagen}}" class="rounded mt-3" >
        <div class="card-body" >
          <div class="alert alert-info" role="alert">
            <h5 class="card-title">TITULO: {{serieService.elegirSerie.titulo}} </h5>
            <p class="card-text">CAPITULOS: {{serieService.elegirSerie.capitulos}} </p>
            <p class="card-text">CATEGORIA: {{serieService.elegirSerie.categorias}}</p>
            <p class="card-text">EMISION: {{serieService.elegirSerie.emision}}</p>
            <p class="card-text">SINOPSIS: {{serieService.elegirSerie.sinopsis}}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
